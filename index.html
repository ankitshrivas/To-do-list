<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheather App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="weather.css">

</head>

<body>


    <div class="container">

        <div class="todo-app">
            <h1>Welcome My To-Do List <img
                    src="https://tse1.mm.bing.net/th/id/OIP.nhAHSECcAw1cc0ZKPd-q3AHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                    height="50px" width="40px"></h1>

            <div class="row">
                <input type="text" id="inputText" placeholder="Enter Your task....">
                <button id="AddBtn">Add task</button>
            </div>

            <ul id="list"></ul>

        </div>

    </div>

</body>

<script>

    const inputText = document.querySelector('#inputText')
    const AddBtn = document.querySelector('#AddBtn')
    const list = document.querySelector('#list')

    AddBtn.addEventListener('click', function () {

        const input = inputText.value.trim();

        if (input === '') {
            return;
        } else {

            const li = document.createElement('li')
            li.textContent = input;
            list.appendChild(li)


            const deleteBtn = document.createElement('button')

            deleteBtn.textContent = 'Delete'
            deleteBtn.classList.add('deleteBtn')
            li.appendChild(deleteBtn);

            li.addEventListener('click', function () {
                li.classList.toggle('completed')
            })


            deleteBtn.addEventListener('click', function (e) {
                e.stopPropagation()
                li.remove()
            })

        }

        inputText.value = ""

    });

    li.addEventListener('click', function (e) {
        if (e.target.tagName === "LI") {
            e.target.classList.toggle('completed')
        } else if (e.target.tagName === "button") {
            e.target.parentElement.remove()
        }
    },)

</script>

</html>
